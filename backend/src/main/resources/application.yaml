spring:
  # 1. 데이터베이스 설정
  datasource:
    url: jdbc:mysql://localhost:3306/ez_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 2. JPA 설정 (DB 테이블 자동 생성 및 쿼리 로그 확인용)
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # 3. 소셜 로그인 설정
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: MY_GOOGLE_CLIENT_ID
            client-secret: MY_GOOGLE_CLIENT_SECRET
            scope:
              - email
              - profile
          naver:
            client-id: MY_NAVER_CLIENT_ID
            client-secret: MY_NAVER_CLIENT_SECRET
            client-name: Naver
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/naver"
            scope:
              - name
              - email
              - profile_image
#          kakao:
#            client-id: YOUR_KAKAO_REST_API_KEY # 발급받은 REST API 키
#            client-secret: YOUR_KAKAO_CLIENT_SECRET # (선택사항이나 보안상 설정 권장)
#            client-authentication-method: client_secret_post
#            authorization-grant-type: authorization_code
#            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
#            client-name: Kakao
#            scope:
#              - profile_nickname
#              - account_email
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response # 네이버는 응답값이 response 객체 안에 들어있음
#          kakao:
#            authorization-uri: https://kauth.kakao.com/oauth/authorize
#            token-uri: https://kweb.kakao.com/oauth/token # 혹은 https://kauth.kakao.com/oauth/token
#            user-info-uri: https://kapi.kakao.com/v2/user/me
#            user-name-attribute: id # 카카오는 식별자가 id임
# 검색 캐쉬 의존성 추가
  cache:
    type: simple