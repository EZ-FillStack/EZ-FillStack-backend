spring:
  # 1. 데이터베이스 설정
  datasource:
    url: jdbc:mysql://localhost:3306/ego_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 2. JPA 설정 (DB 테이블 자동 생성 및 쿼리 로그 확인용)
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # 3. 소셜 로그인 설정
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${MY_GOOGLE_CLIENT_ID}
            client-secret: ${MY_GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
          naver:
            client-id: ${MY_NAVER_CLIENT_ID}
            client-secret: ${MY_NAVER_CLIENT_SECRET}
            client-name: Naver
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/naver"
            scope:
              - name
              - email
              - profile_image
        #          kakao:
        #            client-id: ${YOUR_KAKAO_REST_API_KEY}
        #            client-secret: ${YOUR_KAKAO_CLIENT_SECRET}
        #            client-authentication-method: client_secret_post
        #            authorization-grant-type: authorization_code
        #            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
        #            client-name: Kakao
        #            scope:
        #              - profile_nickname
        #              - account_email
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
  #          kakao:
  #            authorization-uri: https://kauth.kakao.com/oauth/authorize
  #            token-uri: https://kweb.kakao.com/oauth/token
  #            user-info-uri: https://kapi.kakao.com/v2/user/me

  # 검색 캐쉬
  cache:
    type: simple

  # Gmail
  mail:
    host: smtp.gmail.com
    port: 587
    username: ez.fillstack@gmail.com
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# cloudflare token
cloudflare:
  r2:
    public-url: https://pub-abe5952db726492dbfcf21b4743e703f.r2.dev
    endpoint: https://491744b56cb1d03f6e5eb117e658ff9e.r2.cloudflarestorage.com
    bucket-name: ego
    access-key: ${R2_ACCESS_KEY}
    secret-key: ${R2_SECRET_KEY}
    region: auto

# KOPIS API
kopis:
  api:
    key: ${KOPIS_API_KEY}
    url: "https://www.kopis.or.kr/openApi/restful/pblprfr"